    genericName: Value Governance
    longDescription: |
      **Maps Group **è presente nel mercato **ESG** con la soluzione Open Source
      **GZOOM Value Governance**. Nell'ambito pubblico, la soluzione viene
      adottata come strumento **programmatorio strategico **per orientare
      l’azione delle Amministrazioni alla creazione di **valore sostenibile**,
      inteso come l’insieme dei benefici sociali, ambientali ed economici per i
      cittadini. Si riportano di seguito i principali moduli applicativi:


      Pianificazione


      - Performance Strategica

      - Pianificazione Integrata (PIAO)


      Programmazione


      - Performance Operativa

      - Performance Individuale


      Gestione della Qualità


      - Miglioramento continuo

      - Processi e Procedimenti Amministrativi


      Gestione del Rischio


      - Anticorruzione

      - Antiriciclaggio

      - 231 – Responsabilità Amministrativa

      - GDPR


      Controllo delle Attività


      - Task Management (Lavoro Agile)

      - Gestione Progetti


      Gestione Risorse Economico Finanziarie


      - Contabilità Analitica

      - Controllo di Gestione


      Rendicontazione agli stakeholder


      - Obblighi di Trasparenza

      - Rendicontazione Sociale


      Coinvolgimento degli Stakeholder


      - Bilancio di Sostenibilità

      - Valutazione partecipativa
    shortDescription: Gzoom Value Governance
