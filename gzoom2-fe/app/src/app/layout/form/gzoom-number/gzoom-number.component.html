<form *ngIf="this.form" [formGroup]="this.form">
  <p-inputNumber
    inputId="{{ this.controlName() }}"
    locale="it-IT"
    [mode]="this.mode()"
    [minFractionDigits]="this.minFractionDigits()"
    [maxFractionDigits]="this.maxFractionDigits()"
    [min]="this.min()"
    [max]="this.max()"
    formControlName="{{ this.controlName() }}"
  ></p-inputNumber>
</form>
