<div class="column-flex" [ngStyle]="{ width: '100%', 'min-width': minWidth }">
  <gzoom-label-input
    [label]="this.label"
    [required]="this.required"
    [flag]="this.flag"
  />
  <gzoom-text-area
    style="width: 100%"
    [maxLength]="this.maxLength"
    [controlName]="this.controlName"
  />
</div>
