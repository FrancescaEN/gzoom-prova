<div class="d-flex flex-row align-items-center">
  <label *ngIf="this.label" class="label-input">
    {{ this.label | i18n }}<ng-container *ngIf="this.required">*</ng-container>
  </label>
  <img
    *ngIf="this.flag && 'BILING' | i18nLangType"
    class="icon-flag"
    src="{{ this.flag | i18nIconFlagName }}"
    alt=""
  />
</div>
