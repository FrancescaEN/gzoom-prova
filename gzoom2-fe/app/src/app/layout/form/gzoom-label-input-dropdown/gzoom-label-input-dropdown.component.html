<div class="column-flex" [style]="'width: 240px'">
  <gzoom-label-input
    [label]="this.label"
    [required]="this.required"
    [flag]="this.flag"
  />
  <gzoom-dropdown
    [ngStyle]="{width: width}"
    [options]="this.options"
    [controlName]="this.controlName"
    [virtualScroll]="virtualScroll"
    [virtualScrollItemSize]="virtualScrollItemSize"
    [showClear]="showClear"
    [filter]="filter"
  />
</div>
