<div>
  <button
    type="button"
    role="button"
    pButton
    pRipple
    [icon]="icon? icon : 'pi pi-ellipsis-h'"
    (click)="menu.toggle($event)"
    [disabled]="disabled"
  ></button>
  <p-menu #menu [appendTo]="'body'" [model]="items" [popup]="true"  role="listitem"
  attr.aria-label="{{ 'Select item of menu' | i18n }}" />
</div>
