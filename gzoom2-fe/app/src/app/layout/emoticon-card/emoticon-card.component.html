<div class="emoticonCard" [style.background-color]="color" role="img">
  <div
    *ngIf="!!text || !!value || value == 0"
    class="text"
    attr.aria-label="{{ 'Percentage accomplished' | i18n }}"
  >
    {{ text }} <br *ngIf="!!text" />
    <span
      *ngIf="!!value || value == 0"
      style="font-weight: bold; font-size: 20px"
      >{{ value | formatNumberIT }}</span
    >
  </div>

  <div *ngIf="!!text || !!value || value == 0" style="width: 12px"></div>

  <!--EMOTICON-->
  <img
    *ngIf="iconId === 'EMOT_GREEN'"
    src="assets/images/emoticonCard/smiling.svg"
    attr.aria-label="{{ 'Emoticon happy' | i18n }}"
  />
  <img
    *ngIf="iconId === 'EMOT_YELLOW'"
    src="assets/images/emoticonCard/neutral.svg"
    attr.aria-label="{{ 'Emoticon normal' | i18n }}"
  />
  <img
    *ngIf="iconId === 'EMOT_RED'"
    src="assets/images/emoticonCard/sad.svg"
    attr.aria-label="{{ 'Emoticon sad' | i18n }}"
  />

  <!--ARROW-->
  <img
    *ngIf="iconId === 'ARROW_RED'"
    src="assets/images/emoticonCard/arrow_DOWN.svg"
  />
  <img
    *ngIf="iconId === 'ARROW_YELLOW'"
    src="assets/images/emoticonCard/arrow_RIGHT.svg"
  />
  <img
    *ngIf="iconId === 'ARROW_GREEN'"
    src="assets/images/emoticonCard/arrow_UP.svg"
  />
</div>
