<p-card>
  <div class="card-label">
    <ng-template ngFor let-item [ngForOf]="this.details" let-i="index">
      <b>{{ item.title | i18n }}:</b> &nbsp;
      <label style="font-size: 13.5px">{{ item.description }}</label
      >
      <ng-container *ngIf="index + 1 != this.details.lenght"
        ><br
      /></ng-container>
    </ng-template>
  </div>
</p-card>
