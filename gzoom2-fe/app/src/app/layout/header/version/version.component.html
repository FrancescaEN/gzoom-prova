<p-table
  id="table-card"
  class="p-datatable-sm"
  [value]="versions() | defaultOrderKeyValue"
>
  <ng-template pTemplate="body" let-version>
    <tr>
      <td>{{ version.key }}</td>
      <td>
        <p-tag
          [value]="version.value"
          [style]="{
            backgroundColor: '#f1f5f9',
            color: '#475569',
          }"
        />
      </td>
    </tr>
  </ng-template>
</p-table>
