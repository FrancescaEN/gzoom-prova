<p-button [ariaLabel]="ariaLabel()"
          [label]="label()"
          [icon]="icon()"
          [iconPos]="iconPos()"
          [size]="size()"
          [rounded]="rounded()"
          [link]="link()"
          [outlined]="outlined()"
          [disabled]="disabled()"
          (onClick)="handleClick($event)">
  <ng-content />
</p-button>
