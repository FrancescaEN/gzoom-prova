<button
  pButton
  id="button-link"
  pTooltip="{{ tooltipLabel }}"
  [tooltipOptions]="tooltipOptions"
  [tooltipPosition]="tooltipPosition"
  [label]="label"
  [icon]="icon"
  loadingIcon="pi pi-spin pi-spinner"
  [loading]="loading"
  [iconPos]="iconPos"
  (click)="click($event)"
  [disabled]="disabled"
  role="button"
  [style]="buttonStyle"
></button>
