<p-dialog
  #dialogChart
  [(visible)]="show"
  [breakpoints]="{ '960px': '75vw', '640px': '100vw' }"
  [style]="{ width: '50vw' }"
  [maximizable]="true"
  (onHide)="hide()"
  (click)="dialogChart.moveOnTop()"
>
  <ng-template pTemplate="header">
    <span class="titleDialog">{{ showDialogTitle }}</span>
    <div style="width: 20%">
      <p-dropdown
        [autoWidth]="false"
        [style]="{ width: '100%' }"
        [options]="chartItemsDialog"
        optionLabel="name"
        (onChange)="setChartTypeDialog()"
        [(ngModel)]="selectedChartItemDialog"
        [disabled]="!!!chartConfigDialog"
      >
      </p-dropdown>
    </div>
  </ng-template>
  <app-spinner [loading]="loadingDialog"></app-spinner>
  <div *ngIf="!!chartConfigDialog && !loadingDialog">
    <app-chart [chartConfiguration]="chartConfigDialog"></app-chart>
  </div>
  <div *ngIf="!!!chartConfigDialog && !loadingDialog">
    {{ "There is no data to display" | i18n }}
  </div>
</p-dialog>
