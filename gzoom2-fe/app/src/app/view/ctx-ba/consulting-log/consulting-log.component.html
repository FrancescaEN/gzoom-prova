<app-primary-board
  [headArray]="headArray"
  [gridArray]="gridArray"
  [loading]="loading"
  [collapseSidebar]="true"
  [scrollHeight]="'70vh'"
  [selectedOn]="false"
  (buttonShareItemEvent)="shareItemEvent($event)"
  [itemsButtonSlideMenu]="itemsButtonSlideMenu"
  stateKey="consultingLog"
  [paginationEnabled]="true"
  (shareInfoPaginationEvent)="shareInfoPagination($event)"
  (loadData)="loadData($event)"
  [totalRecords]="totalRecords"
  stateKey="jobLog"
></app-primary-board>
