<app-primary-board
  [headArray]="headArray"
  [gridArray]="gridArray"
  [buttonBack]="false"
  [flag]="flag"
  [loading]="loading"
  [collapseSidebar]="true"
  [scrollHeight]="'70vh'"
  [elementToAdd]="elementToAdd"
  (saveNewAndOpen)="saveNewAndOpen($event)"
  (saveAllElement)="saveAllElement($event)"

  (openNew)="openNew()"
  (delete)="delete($event)"
  stateKey="position-economics"
></app-primary-board>
