<app-primary-board
  [headArray]="headArray"
  [gridArray]="gridArray"
  [buttonBack]="true"
  [loading]="loading"
  [collapseSidebar]="true"
  [scrollHeight]="'70vh'"
  [flag]="flag"
  [title]="title"
  [elementToAdd]="elementToAdd"
  (saveNewAndOpen)="saveNewAndOpen($event)"
  (saveAllElement)="saveAllElement($event)"
  (resetAllElement)="resetAllElement()"
  (openNew)="openNew()"
  (delete)="delete($event)"
></app-primary-board>
