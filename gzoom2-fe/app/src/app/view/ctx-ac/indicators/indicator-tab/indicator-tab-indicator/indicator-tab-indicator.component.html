<p-toast></p-toast>
<p-messages key="error"></p-messages>

<gzoom-message
  *ngIf="this.warningPurpose$ | async"
  severity="warn"
  icon="pi pi-exclamation-triangle"
  message="{{
    'Select at least one purpose in order to use the indicator correctly.'
      | i18n
  }}"
  labelLink="{{ 'Go to Purpose' | i18n }}"
  routerLink="purpose"
/>
<gzoom-message
  *ngIf="this.warningUODetected$ | async"
  severity="warn"
  icon="pi pi-exclamation-triangle"
  message="{{
    'The indicator has Mode of detection by organizational unit: select at least one item.'
      | i18n
  }}"
  labelLink="{{ 'Go to UO detected' | i18n }}"
  routerLink="uo-detected"
/>
<gzoom-message
  *ngIf="this.warningCalculationFormula$ | async"
  severity="warn"
  icon="pi pi-exclamation-triangle"
  message="{{
    'The indicator has a Calculation Formula selected: enter the Calculation Parameters.'
      | i18n
  }}"
  labelLink="{{ 'Go to Calculation parameters' | i18n }}"
  routerLink="calculation-parameters"
/>
<gzoom-message
  *ngIf="this.warningValueList$ | async"
  severity="warn"
  icon="pi pi-exclamation-triangle"
  message="{{
    'The indicator has Units of Measurement that provides a list of values: enter at least one item.'
      | i18n
  }}"
  labelLink="{{ 'Go to value list' | i18n }}"
  routerLink="value-list"
/>
<form *ngIf="form" [formGroup]="form" (onSubmit)="onSubmit()">
  <p-accordion [multiple]="true" [activeIndex]="activeIndex">
    <p-accordionTab header="{{ 'Distinctive data' | i18n }}">
      <gzoom-row-flex>
        <gzoom-label-input-text
          *ngIf="this.accountName"
          label="Title"
          [required]="true"
          [width]="'100%'"
          style="width: 100%"
          flag="0"
          controlName="accountName"
        />
      </gzoom-row-flex>
      <gzoom-row-flex *ngIf="this.accountNameLang && this.BILING">
        <gzoom-label-input-text
          label="Title"
          [required]="true"
          [width]="'100%'"
          style="width: 100%"
          flag="1"
          controlName="accountNameLang"
        />
      </gzoom-row-flex>
      <gzoom-row-flex>
        <gzoom-label-input-text
          *ngIf="this.accountCode"
          label="Code"
          [maxlength]="100"
          [required]="true"
          [width]="'100%'"
          style="width: 48.8%; min-width: 240px"
          controlName="accountCode"
        />
        <gzoom-label-input-number
          *ngIf="this.sequenceId"
          label="Sequence"
          controlName="sequenceId"
        />

        <gzoom-label-input-dropdown
          *ngIf="this.currentStatusId"
          label="State"
          [required]="true"
          [options]="statusItems$ | async"
          controlName="currentStatusId"
        />
      </gzoom-row-flex>
      <gzoom-row-flex>
        <gzoom-label-input-date
          *ngIf="fromDate"
          label="Start date"
          [showClear]="true"
          controlName="fromDate"
        />
        <gzoom-label-input-date
          *ngIf="thruDate"
          label="End date"
          controlName="thruDate"
          [showClear]="true"
          [minDate]="fromDate.value"
        />
      </gzoom-row-flex>
      <gzoom-row-flex>
        <gzoom-label-input-text-area
          *ngIf="this.description"
          [style]="
            'width: ' + (('BILING' | i18nLangType) ? '48.80' : 100) + '%'
          "
          [minWidth]="'240px'"
          label="Description"
          [required]="false"
          flag="0"
          maxLength="2000"
          controlName="description"
        />

        <gzoom-label-input-text-area
          *ngIf="this.descriptionLang && this.BILING"
          [style]="'width: 48.80%;'"
          [minWidth]="'240px'"
          label="Description"
          [required]="false"
          flag="1"
          maxLength="2000"
          controlName="descriptionLang"
        />
      </gzoom-row-flex>
      <gzoom-row-flex>
        <gzoom-label-input-text-area
          *ngIf="this.source"
          [style]="
            'width: ' + (('BILING' | i18nLangType) ? '48.80' : 100) + '%'
          "
          [minWidth]="'240px'"
          label="Source"
          [required]="false"
          flag="0"
          maxLength="2000"
          controlName="source"
        />

        <gzoom-label-input-text-area
          *ngIf="this.sourceLang && this.BILING"
          [style]="'width: 48.80%;'"
          [minWidth]="'240px'"
          label="Source"
          [required]="false"
          flag="1"
          maxLength="2000"
          controlName="sourceLang"
        />
      </gzoom-row-flex>
    </p-accordionTab>
    <p-accordionTab header="{{ 'Classifications' | i18n }}">
      <gzoom-row-flex>
        <gzoom-label label="Tipology" labelPos="top" required="true">
          <gzoom-dropdown
            [options]="this.glAccountType$ | async"
            style="width: 240px"
            controlName="glAccountTypeId"
            [filter]="true"
          />
        </gzoom-label>
        <gzoom-label label="Natura" labelPos="top">
          <gzoom-dropdown
            [options]="this.glResourceType$ | async"
            style="width: 240px"
            controlName="glResourceTypeId"
            [showClear]="true"
            [filter]="true"
          />
        </gzoom-label>
        <gzoom-label label="Classification" labelPos="top">
          <gzoom-dropdown
            [options]="this.glAccountClass$ | async"
            style="width: 240px"
            controlName="glAccountClassId"
            [showClear]="true"
            [filter]="true"
          />
        </gzoom-label>
        <gzoom-label label="Connected unit" labelPos="top">
          <gzoom-dropdown
            [options]="this.referencedAccount$ | async"
            style="width: 240px"
            controlName="referencedAccountId"
            [showClear]="true"
            [filter]="true"
          />
        </gzoom-label>
        <gzoom-label label="Powering system" labelPos="top">
          <gzoom-dropdown
            [options]="this.dataSource$ | async"
            style="width: 240px"
            controlName="dataSourceId"
            [showClear]="true"
            [filter]="true"
          />
        </gzoom-label>
      </gzoom-row-flex>
      <br />
    </p-accordionTab>
    <p-accordionTab header="{{ 'Values management' | i18n }}">
      <gzoom-message
        *ngIf="this.cleanCalcCustomMethod"
        severity="warn"
        icon="pi pi-exclamation-triangle"
        message="{{
          'Deleting the Calculation Formula upon saving will delete all associated Calculation Parameters.'
            | i18n
        }}"
      />
      <gzoom-row-flex>
        <div>
          <gzoom-label label="Detection mode" labelPos="top" required="true">
            <gzoom-dropdown
              [options]="this.detectionModeItems"
              style="width: 240px"
              controlName="detectionMode"
              [filter]="true"
            />
          </gzoom-label>
          <div class="d-flex flex-row-reverse">
            <a
              *ngIf="isByOrganizationUnit$ | async"
              [ngClass]="{ isDisabled: editMode }"
              routerLink="uo-detected"
              >{{ "Go to UO detected" | i18n }}</a
            >
          </div>
        </div>

        <div>
          <gzoom-label label="Calculation formula" labelPos="top">
            <gzoom-dropdown
              [options]="this.customMethod$ | async"
              style="width: 240px"
              controlName="calcCustomMethodId"
              [filter]="true"
              [showClear]="true"
            />
          </gzoom-label>
          <div class="d-flex flex-row-reverse">
            <a
              *ngIf="calcCustomMethodIdIsNotNull$ | async"
              routerLink="calculation-parameters"
              [ngClass]="{ isDisabled: editMode }"
              >{{ "Go to Calculation parameters" | i18n }}</a
            >
          </div>
        </div>

        <gzoom-label label="Calculation priority" labelPos="top">
          <gzoom-number controlName="prioCalc" />
        </gzoom-label>
        <div>
          <gzoom-label label="Uom" labelPos="top" required="true">
            <gzoom-dropdown
              [options]="this.uom$ | async"
              style="width: 240px"
              controlName="defaultUomId"
              [filter]="true"
            />
          </gzoom-label>
          <div class="d-flex flex-row-reverse">
            <a
              *ngIf="this.uomIsRatingScale$ | async"
              [ngClass]="{ isDisabled: editMode }"
              routerLink="value-list"
              >{{ "Go to value list" | i18n }}</a
            >
          </div>
        </div>
        <gzoom-label label="Periodicity" labelPos="top" required="true">
          <gzoom-dropdown
            [options]="this.periodType$ | async"
            style="width: 240px"
            controlName="periodTypeId"
            [filter]="true"
          />
        </gzoom-label>
      </gzoom-row-flex>
      <br />
    </p-accordionTab>
    <p-accordionTab header="{{ 'Score calculation rules' | i18n }}">
      <gzoom-row-flex>
        <gzoom-label
          label="Debit Credit Default"
          labelPos="top"
          required="true"
        >
          <gzoom-dropdown
            [options]="this.creditDefault$ | async"
            style="width: 240px"
            controlName="debitCreditDefault"
            [filter]="true"
          />
        </gzoom-label>
        <gzoom-label label="Measure type" labelPos="top" required>
          <gzoom-dropdown
            [options]="this.weMeasureTypeEnumId$ | async"
            style="width: 240px"
            controlName="weMeasureTypeEnumId"
            [filter]="true"
          />
        </gzoom-label>
        <gzoom-label label="Target competence" labelPos="top" required>
          <gzoom-dropdown
            [options]="this.targetPeriodEnumId$ | async"
            style="width: 240px"
            controlName="targetPeriodEnumId"
            [filter]="true"
          />
        </gzoom-label>
        <gzoom-label label="Target absence" labelPos="top" required>
          <gzoom-dropdown
            [options]="this.weWithoutTarget$ | async"
            style="width: 240px"
            controlName="weWithoutTarget"
            [filter]="true"
          />
        </gzoom-label>

        <gzoom-label label="Value competence" labelPos="top" required>
          <gzoom-dropdown
            [options]="this.periodicalAbsoluteEnumId$ | async"
            style="width: 240px"
            controlName="periodicalAbsoluteEnumId"
            [filter]="true"
          />
        </gzoom-label>
        <gzoom-label label="We Without Perf" labelPos="top" required>
          <gzoom-dropdown
            [options]="this.weWithoutPerf$ | async"
            style="width: 240px"
            controlName="weWithoutPerf"
            [filter]="true"
          />
        </gzoom-label>
        <gzoom-label label="We Score Conv Enum Id" labelPos="top" required>
          <gzoom-dropdown
            [options]="this.weScoreConvEnumId$ | async"
            style="width: 240px"
            controlName="weScoreConvEnumId"
            [filter]="true"
          />
        </gzoom-label>
        <gzoom-label label="Rule scoring" labelPos="top" required>
          <gzoom-dropdown
            [options]="this.weScoreRangeEnumId$ | async"
            style="width: 240px"
            controlName="weScoreRangeEnumId"
            [filter]="true"
          />
        </gzoom-label>
        <gzoom-label label="Bands values" labelPos="top">
          <gzoom-dropdown
            [options]="this.uomRangeId$ | async"
            style="width: 240px"
            controlName="uomRangeId"
            [filter]="true"
            [showClear]="true"
          />
        </gzoom-label>
      </gzoom-row-flex>
      <br />
    </p-accordionTab>
    <p-accordionTab header="{{ labelAccordionGlAccountManagement() | i18n }}">
      <gzoom-message
        severity="info"
        icon="pi pi-info-circle"
        message="{{
          'Select the Role and Organizational Unit whose managers or delegates can manage the indicator.'
            | i18n
        }}"
      />

      <gzoom-row-flex>
        <gzoom-label
          label="Role OU manager"
          labelPos="top"
          [required]="!(isFullAdmin$ | async)"
        >
          <gzoom-dropdown
            [options]="this.respCenterRoleType$ | async"
            style="width: 240px"
            controlName="respCenterRoleTypeId"
            [filter]="true"
            [showClear]="true"
          />
        </gzoom-label>
        <gzoom-label
          label="respCenterId"
          labelPos="top"
          [required]="!(isFullAdmin$ | async)"
        >
          <gzoom-dropdown
            [options]="this.respCenterId$ | async"
            style="width: 240px"
            controlName="respCenterId"
            [filter]="true"
            [showClear]="true"
          />
        </gzoom-label>
      </gzoom-row-flex>
    </p-accordionTab>
  </p-accordion>
</form>
<p-confirmDialog />
