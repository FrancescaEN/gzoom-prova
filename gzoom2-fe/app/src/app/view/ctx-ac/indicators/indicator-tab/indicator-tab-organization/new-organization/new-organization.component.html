<p-table
  [value]="party | async"
  responsiveLayout="stack"
  [breakpoint]="'960px'"
  [tableStyle]="{ 'min-width': '20rem' }"
  id="table-card"
  [(selection)]="selectedItems"
  [paginator]="true"
  [rows]="10"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="{{
    'Showing {first} to {last} of {totalRecords} entries' | i18n
  }}"
  [rowsPerPageOptions]="[10, 25, 50]"
  scrollHeight="40vh"
  [scrollable]="scrollable | async"
  [loading]="loading"
  (onRowSelect)="setChip($event)"
  (onRowUnselect)="removeChip($event)"
  (selectAllChange)="allChip($event)"
>
  <ng-template pTemplate="header" let-columns>
    <tr>
      <th
        class="table-head-th"
        style="width: 1rem; padding-right: 5px !important"
      >
        <p-tableHeaderCheckbox
          (click)="allChip($event)"
        ></p-tableHeaderCheckbox>
      </th>

      <th class="table-head-th padding-medium-row-th">
        <div class="d-flex align-items-center">
          {{ "Organization" | i18n }}*
          <p-sortIcon pSortableColumn="label" field="label" />
          <p-columnFilter
            type="text"
            field="label"
            display="menu"
          ></p-columnFilter>
        </div>
      </th>
    </tr>
  </ng-template>
  <ng-template
    pTemplate="body"
    let-party
    let-columns="columns"
    let-editing="editing"
  >
    <tr>
      <td>
        <p-tableCheckbox [value]="party"></p-tableCheckbox>
      </td>

      <td style="padding-left: 0px !important">
        <span class="p-column-title" style="padding-right: 10px">
          <b>{{ "Organization" | i18n }}*</b></span
        >{{ party.label }}
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="paginatorleft"></ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="20" role="cell">
        <p class="emptyRow">{{ "There is no data to display" | i18n }}</p>
      </td>
    </tr>
  </ng-template>
</p-table>
<div style="min-height: 60px">
  <gzoom-label [label]="('Selected organizations' | i18n) + ':'" labelPos="top">
    <i *ngIf="chip.length == 0" style="padding-left: 5px">{{
        "No organization selected" | i18n
      }}</i>
    <div
      *ngIf="chip.length > 0"
      style="
        display: flex;
        flex-direction: row;
        gap: 5px;
        flex-wrap: wrap;
        align-items: baseline;
      "
    >
      <ng-template ngFor let-item [ngForOf]="chip" let-i="index">
        <p-chip>
          <div
            style="
              height: 25px;
              display: flex;
              flex-direction: row;
              align-items: center;
            "
          >
            {{ item.label }}
          </div>
        </p-chip
        >
      </ng-template>
    </div>
  </gzoom-label>
</div>
<br />
<form [formGroup]="form">
  <gzoom-row-flex>
    <gzoom-label-input-date
      *ngIf="fromDate"
      label="Start validity"
      [showClear]="true"
      controlName="fromDate"
      [maxDate]="thruDate.value"
    />
    <gzoom-label-input-date
      *ngIf="thruDate"
      label="End validity"
      controlName="thruDate"
      [showClear]="true"
      [minDate]="fromDate.value"
    />
  </gzoom-row-flex>
  <p-messages key="error-dialog"></p-messages>
  <div class="d-flex flex-row-reverse pt-3" style="gap: 5px">
    <gzoom-button
      icon="pi pi-save"
      label="{{ 'Add and save' | i18n }}"
      [disabled]="!(selectedItems.length > 0)"
      (onClick)="addAndSave()"
    />
    <gzoom-button-outlined
      label="{{ 'Reset selection' | i18n }}"
      [disabled]="!(selectedItems.length > 0)"
      (onClick)="resetSelection()"
    />
  </div>
</form>
