<form *ngIf="form" [formGroup]="form" (onSubmit)="onSubmit()">
  <p-accordion [multiple]="true" [activeIndex]="activeIndex">
    <p-accordionTab header="{{ 'Distinctive data' | i18n }}">
      <gzoom-row-flex>
        <gzoom-label-input-text
          *ngIf="this.accountName"
          label="Title"
          [required]="true"
          [width]="'100%'"
          style="width: 100%"
          flag="0"
          controlName="accountName"
        />
      </gzoom-row-flex>
      <gzoom-row-flex *ngIf="this.accountNameLang && this.BILING">
        <gzoom-label-input-text
          label="Title"
          [required]="true"
          [width]="'100%'"
          style="width: 100%"
          flag="1"
          controlName="accountNameLang"
        />
      </gzoom-row-flex>
      <gzoom-row-flex>
        <gzoom-label-input-text
          *ngIf="this.accountCode"
          label="Code"
          [maxlength]="100"
          [width]="'100%'"
          style="width: 48.8%; min-width: 240px"
          controlName="accountCode"
        />
        <gzoom-label-input-number
          *ngIf="this.sequenceId"
          label="Sequence"
          controlName="sequenceId"
        />
      </gzoom-row-flex>
      <gzoom-row-flex>
        <gzoom-label-input-text-area
          *ngIf="this.description"
          [style]="
            'width: ' + (('BILING' | i18nLangType) ? '48.80' : 100) + '%'
          "
          [minWidth]="'240px'"
          label="Description"
          [required]="false"
          flag="0"
          maxLength="2000"
          controlName="description"
        />

        <gzoom-label-input-text-area
          *ngIf="this.descriptionLang && this.BILING"
          [style]="'width: 48.80%;'"
          [minWidth]="'240px'"
          label="Description"
          [required]="false"
          flag="1"
          maxLength="2000"
          controlName="descriptionLang"
        />
      </gzoom-row-flex>
    </p-accordionTab>
    <p-accordionTab header="{{ 'Classifications' | i18n }}">
      <gzoom-row-flex>
        <gzoom-label label="Tipology" labelPos="top" required="true">
          <gzoom-dropdown
            [options]="this.glAccountType"
            style="width: 240px"
            controlName="glAccountTypeId"
            [showClear]="true"
            [filter]="true"
          />
        </gzoom-label>
        <gzoom-label label="Purpose" labelPos="top">
          <gzoom-multiselect
            [options]="this.workEffortPurposeType"
            style="width: 240px"
            controlName="workEffortPurposeTypeId"
            [showClear]="true"
          />
        </gzoom-label>
      </gzoom-row-flex>
    </p-accordionTab>
    <p-accordionTab header="{{ 'Values management' | i18n }}">
      <gzoom-row-flex>
        <gzoom-label label="Detection mode" labelPos="top" required="true">
          <gzoom-dropdown
            [options]="this.detectionModeItems"
            style="width: 240px"
            controlName="detectionMode"
            [filter]="true"
          />
        </gzoom-label>
        <gzoom-label label="Uom" labelPos="top" required="true">
          <gzoom-dropdown
            [options]="this.uom$ | async"
            style="width: 240px"
            controlName="defaultUomId"
            [filter]="true"
          />
        </gzoom-label>
        <gzoom-label label="Periodicity" labelPos="top" required="true">
          <gzoom-dropdown
            [options]="this.periodType"
            style="width: 240px"
            controlName="periodTypeId"
            [filter]="true"
          />
        </gzoom-label>
      </gzoom-row-flex>
    </p-accordionTab>
    @if (isRespSignal()) {
      <p-accordionTab header="{{ 'Indicator management' | i18n }}">
        <gzoom-message
          severity="info"
          icon="pi pi-info-circle"
          message="{{
            'Select the Role and Organizational Unit whose managers or delegates can manage the indicator.'
              | i18n
          }}"
        />

        <gzoom-row-flex>
          <gzoom-label label="Role OU manager" labelPos="top" required>
            <gzoom-dropdown
              *ngIf="this.respCenterRoleTypeId"
              [options]="this.respCenterRoleType$ | async"
              style="width: 240px"
              controlName="respCenterRoleTypeId"
              [filter]="true"
              [showClear]="true"
            />
          </gzoom-label>
          <gzoom-label label="respCenterId" labelPos="top" required>
            <gzoom-dropdown
              *ngIf="this.respCenterId"
              [options]="this.respCenterId$ | async"
              style="width: 240px"
              controlName="respCenterId"
              [filter]="true"
              [showClear]="true"
            />
          </gzoom-label>
        </gzoom-row-flex>
      </p-accordionTab>
    }
  </p-accordion>
  <p-messages key="error-dialog"></p-messages>
  <div class="d-flex flex-row-reverse pt-3">
    <gzoom-button
      icon="pi pi-save"
      label="{{ 'Save' | i18n }}"
      (onClick)="create()"
      rounded="true"
    />
  </div>
</form>
