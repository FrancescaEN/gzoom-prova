@if (!loading_login) {
  <section
    *ngIf="!loading_login"
    role="figure"
    class="login vh-100"
    style="background-color: #f2f7fb"
  >
    <div
      style="
        position: absolute;
        height: 100%;
        display: flex;
        flex-direction: column-reverse;
      "
    >
      <div></div>
      <img
        style="position: fixed; width: 100%"
        src="assets/images/login/cover.svg"
        attr.aria-label="{{ 'Cover' | i18n }}"
      />
    </div>

    <div class="container py-5 h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col col-xl-10">
          <router-outlet></router-outlet>
        </div>
      </div>
      <div
        class="d-flex align-items-center justify-content-center pt-4"
        style="color: white; position: relative; font-weight: bold"
      >
        <span>GZoom2 v.&nbsp;</span><span appMajorMinorVersion></span>
      </div>
    </div>
  </section>
} @else {
  <div
    class="login d-flex"
    style="width: 100%; height: 100%; display: flex; justify-content: center"
  >
    <p-progressSpinner
      [style]="{ top: '50vh', width: '50px', height: '50px' }"
      styleClass="custom-spinner"
      strokeWidth="8"
      fill="var(--surface-ground)"
      animationDuration=".5s"
    ></p-progressSpinner>
  </div>
}
