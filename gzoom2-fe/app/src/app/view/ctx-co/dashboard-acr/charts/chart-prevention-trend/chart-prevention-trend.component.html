@if (loading()) {
  <p-skeleton width="100%" [height]="height()" />
} @else {
  <p-chart
    [type]="type"
    [options]="options"
    [plugins]="plugins"
    [data]="data()"
    [ngStyle]="{
      cursor: cursorPointer() ? 'pointer' : '',
    }"
    (onDataSelect)="selectData($event)"
    width="100%"
    [height]="height()"
  />
}
