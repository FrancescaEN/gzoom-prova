<p-skeleton
  width="100%"
  [height]="height()"
  [ngStyle]="{
    display: loading() ? '' : 'none',
  }"
/>

<p-chart
  id="stateRiskFactors"
  [type]="type"
  [options]="options()"
  [plugins]="plugins"
  [data]="data()"
  [ngStyle]="{
    cursor: cursorPointer() ? 'pointer' : '',
    display: loading() ? 'none' : '',
  }"
  width="100%"
  [height]="height()"
/>
