server.servlet.context-path=/rest
server.port=8080
spring.application.name=spring-boot-service-template
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

spring.profiles.active=cloud-disabled,es-disabled
spring.profiles.default=default
spring.main.allow-circular-references=true

multipart.max-file-size=80MB
multipart.max-request-size=80MB

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB


#endpoints.enabled=false
#endpoints.health.enabled=true
#endpoints.info.enabled=true
#endpoints.metrics.enabled=true
#endpoints.shutdown.enabled=true

management.server.port=8082
#management.security.enabled=false
management.health.elasticsearch.enabled=false
management.endpoints.beans.enabled=false 

spring.quartz.job-store-type=jdbc
spring.jmx.enabled=false

info.app.name=GZoom2
info.app.description=GZoom2
info.app.version=${project.version}
info.app.buildDate = ${timestamp}


spring.config.import=file:/home/zero/Documents/GitHub/performance-pa/workspace/gzoom2-be/config/gzoom.properties
spring.jmx.enabled=false
spring.jmx.default-domain=gzoom
